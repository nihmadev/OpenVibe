[package]
name = "llm"
version = "1.2.0"
edition = "2021"

[dependencies]
agent-api = { path = "../agent-api" }
bytes = "1"
futures = "0.3"
reqwest = { version = "0.13", features = ["json", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
