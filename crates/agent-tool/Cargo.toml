[package]
name = "agent-tool"
version = "1.2.0"
edition = "2021"

[dependencies]
agent-api = { path = "../agent-api" }
llm = { path = "../llm" }
workspace-fs = { package = "fs", path = "../fs" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
futures = "0.3"
mcp = { path = "../mcp" }
browser = { path = "../browser" }
reqwest = { version = "0.13", features = ["json", "http2"] }

[dev-dependencies]
tempfile = "3"
