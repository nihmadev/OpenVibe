[package]
name = "browser"
version = "0.1.0"
edition = "2021"

[dependencies]
base64 = "0.23"
futures-util = "0.3"
reqwest = { version = "0.13", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full", "process"] }
tokio-tungstenite = "0.30"
tracing = "0.1"
url = "2"
uuid = { version = "1", features = ["v4"] }
zip = "8.6"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
